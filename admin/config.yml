backend:
  name: github
  repo: skhalim2322-maker/Dubai-link-Realty-Zoya-Developments
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"

    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        required: false

      - label: "Image"
        name: "image"
        widget: "image"
        required: false

      - label: "Status"
        name: "status"
        widget: "string"
        required: false

      - label: "Location"
        name: "location"
        widget: "string"
        required: false

      - label: "Price"
        name: "price"
        widget: "string"
        required: false

      - label: "Payment Plan"
        name: "payment_plan"
        widget: "string"
        required: false

      - label: "Handover"
        name: "handover"
        widget: "string"
        required: false

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Featured"
        name: "featured"
        widget: "boolean"
        default: false
        required: false

      - label: "Brochures"
        name: "brochures"
        widget: "list"
        required: false
        fields:
          - label: "Name"
            name: "name"
            widget: "string"
            required: false

          - label: "File"
            name: "file"
            widget: "file"
            required: false

          - label: "URL"
            name: "url"
            widget: "string"
            required: false

      - label: "Locations"
        name: "locations"
        widget: "list"
        required: false
        fields:
          - label: "Name"
            name: "name"
            widget: "string"
            required: false

          - label: "Address"
            name: "address"
            widget: "string"
            required: false

          - label: "Map URL"
            name: "map_url"
            widget: "string"
            required: false
