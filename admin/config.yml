backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:

  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "Content/Projects"
    create: true
    slug: "{{slug}}"

    fields:

      - label: "Project Title"
        name: "title"
        widget: "string"
        required: false

      - label: "Project Image"
        name: "image"
        widget: "image"
        required: false

      - label: "Status"
        name: "status"
        widget: "string"
        required: false

      - label: "Location"
        name: "location"
        widget: "string"
        required: false

      - label: "Starting Price"
        name: "price"
        widget: "string"
        required: false

      - label: "Payment Plan"
        name: "payment_plan"
        widget: "string"
        required: false

      - label: "Handover"
        name: "handover"
        widget: "string"
        required: false

      - label: "Description"
        name: "description"
        widget: "text"
        required: false

      - label: "Featured Project"
        name: "featured"
        widget: "boolean"
        required: false
        default: false

      - label: "Brochures"
        name: "brochures"
        widget: "list"
        required: false

        fields:

          - label: "Brochure Name"
            name: "name"
            widget: "string"
            required: false

          - label: "Brochure File"
            name: "file"
            widget: "file"
            required: false

          - label: "External Brochure URL"
            name: "url"
            widget: "string"
            required: false


      - label: "Locations"
        name: "locations"
        widget: "list"
        required: false

        fields:

          - label: "Location Name"
            name: "name"
            widget: "string"
            required: false

          - label: "Address"
            name: "address"
            widget: "string"
            required: false

          - label: "Map URL"
            name: "map_url"
            widget: "string"
            required: false
