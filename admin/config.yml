backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

publish_mode: editorial_workflow

collections:
  # ============================================================
  # GLOBAL SITE SETTINGS
  # ============================================================
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "content/site.yml"
        label: "Global Settings"
        name: "global"
        fields:
          - label: "Brand Name"
            name: "brand_name"
            widget: "string"
            default: "Dubai Link Realty"

          - label: "Partner"
            name: "partner"
            widget: "string"
            default: "Zoya Developments"

          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - label: "Phone"
                name: "phone"
                widget: "string"
                required: false

              - label: "WhatsApp"
                name: "whatsapp"
                widget: "string"
                required: false

              - label: "Email"
                name: "email"
                widget: "string"
                required: false

          - label: "Social Links"
            name: "social"
            widget: "object"
            fields:
              - label: "Instagram"
                name: "instagram"
                widget: "string"
                required: false

              - label: "Facebook"
                name: "facebook"
                widget: "string"
                required: false

              - label: "LinkedIn"
                name: "linkedin"
                widget: "string"
                required: false


  # ============================================================
  # HOME PAGE
  # ============================================================
  - name: "pages"
    label: "Pages"
    files:
      - file: "content/home.yml"
        label: "Home Page"
        name: "home"
        fields:

          # ------------------------------------------------------
          # HERO
          # ------------------------------------------------------
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                default: "Exclusive Partnership with Zoya Developments"

              - label: "Headline"
                name: "headline"
                widget: "string"
                default: "Luxury Living in the"

              - label: "Highlighted Headline"
                name: "highlight"
                widget: "string"
                default: "Heart of Dubai"

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Background Image"
                name: "background_image"
                widget: "image"

              - label: "Primary CTA"
                name: "primary_cta"
                widget: "object"
                fields:
                  - label: "Text"
                    name: "text"
                    widget: "string"
                    default: "Explore Properties"

                  - label: "Link"
                    name: "link"
                    widget: "string"
                    default: "#projects"

              - label: "Secondary CTA"
                name: "secondary_cta"
                widget: "object"
                fields:
                  - label: "Text"
                    name: "text"
                    widget: "string"
                    default: "Schedule a Visit"

                  - label: "Link"
                    name: "link"
                    widget: "string"
                    default: "#contact"


          # ------------------------------------------------------
          # ABOUT
          # ------------------------------------------------------
          - label: "About Section"
            name: "about"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                default: "Official Channel Partner"

              - label: "Heading"
                name: "heading"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Image"
                name: "image"
                widget: "image"

              - label: "Commission Statistic"
                name: "commission"
                widget: "object"
                fields:
                  - label: "Value"
                    name: "value"
                    widget: "string"
                    default: "0%"

                  - label: "Label"
                    name: "label"
                    widget: "string"
                    default: "Commission Fee"

              - label: "Escrow Statistic"
                name: "escrow"
                widget: "object"
                fields:
                  - label: "Value"
                    name: "value"
                    widget: "string"
                    default: "100%"

                  - label: "Label"
                    name: "label"
                    widget: "string"
                    default: "Verified Escrow"


          # ------------------------------------------------------
          # PROJECTS INTRO
          # ------------------------------------------------------
          - label: "Projects Section"
            name: "projects_section"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                default: "Zoya Developments"

              - label: "Heading"
                name: "heading"
                widget: "string"
                default: "Featured Flagship Projects"

              - label: "Description"
                name: "description"
                widget: "text"


          # ------------------------------------------------------
          # AMENITIES
          # ------------------------------------------------------
          - label: "Amenities"
            name: "amenities"
            widget: "list"
            required: false
            fields:
              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "string"

              - label: "Icon"
                name: "icon"
                widget: "string"


          # ------------------------------------------------------
          # CONTACT SECTION
          # ------------------------------------------------------
          - label: "Contact Section"
            name: "contact_section"
            widget: "object"
            fields:
              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                default: "Get in Touch"

              - label: "Heading"
                name: "heading"
                widget: "string"
                default: "Register for Project Pricing & Inventory"

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Button Text"
                name: "button_text"
                widget: "string"
                default: "Submit Inquiry"


          # ------------------------------------------------------
          # SEO
          # ------------------------------------------------------
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:
              - label: "Meta Title"
                name: "meta_title"
                widget: "string"
                default: "Dubai Link Realty | Zoya Developments"

              - label: "Meta Description"
                name: "meta_description"
                widget: "text"

              - label: "Social Share Image"
                name: "social_image"
                widget: "image"
                required: false


  # ============================================================
  # PROJECTS
  # ============================================================
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "title"

    fields:
      - label: "Project Name"
        name: "title"
        widget: "string"

      - label: "Location"
        name: "location"
        widget: "string"

      - label: "Project Status"
        name: "status"
        widget: "select"
        options:
          - "Available"
          - "Coming Soon"
          - "Sold Out"

      - label: "Project Type"
        name: "project_type"
        widget: "select"
        options:
          - "Residential"
          - "Mixed Use"
          - "Commercial"

      - label: "Property Types"
        name: "property_types"
        widget: "select"
        multiple: true
        options:
          - "Studio"
          - "1 Bedroom"
          - "2 Bedroom"
          - "3 Bedroom"
          - "Penthouse"
          - "Villa"

      - label: "Cover Image"
        name: "image"
        widget: "image"

      - label: "Short Description"
        name: "excerpt"
        widget: "text"

      - label: "Full Description"
        name: "body"
        widget: "markdown"

      - label: "Starting Price"
        name: "starting_price"
        widget: "string"
        required: false

      - label: "Payment Plan"
        name: "payment_plan"
        widget: "string"
        required: false

      - label: "Handover"
        name: "handover"
        widget: "string"
        required: false

      - label: "Developer"
        name: "developer"
        widget: "string"
        default: "Zoya Developments"

      - label: "Project Features"
        name: "features"
        widget: "list"
        required: false

      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Image"
          name: "image"
          widget: "image"

      - label: "Featured Project"
        name: "featured"
        widget: "boolean"
        default: false
        required: false

      - label: "Display Order"
        name: "order"
        widget: "number"
        value_type: "int"
        default: 0
        required: false

      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        fields:
          - label: "Meta Title"
            name: "meta_title"
            widget: "string"
            required: false

          - label: "Meta Description"
            name: "meta_description"
            widget: "text"
            required: false

          - label: "Social Share Image"
            name: "social_image"
            widget: "image"
            required: false


  # ============================================================
  # LEGAL / DISCLAIMER
  # ============================================================
  - name: "legal"
    label: "Legal & Disclaimer"
    files:
      - file: "content/legal.yml"
        label: "Website Disclaimer"
        name: "disclaimer"
        fields:
          - label: "Disclaimer"
            name: "disclaimer"
            widget: "markdown"

          - label: "Copyright Text"
            name: "copyright"
            widget: "string"
