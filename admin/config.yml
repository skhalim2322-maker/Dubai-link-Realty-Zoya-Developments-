 backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

media_library:
  name: uploadcare

collections:

  # ============================================================
  # SITE SETTINGS / GLOBAL
  # ============================================================

  - name: "site"
    label: "Site Settings"
    description: "Manage global homepage content, SEO, CTA, statistics and amenities."
    files:

      - file: "content/site.yml"
        label: "Global Website Settings"
        name: "settings"

        fields:

          # ------------------------------------------------------
          # BASIC SITE INFORMATION
          # ------------------------------------------------------

          - label: "Website Title"
            name: "title"
            widget: "string"
            hint: "Main website title used for the homepage."

          - label: "Website Description"
            name: "description"
            widget: "text"
            required: false
            hint: "Short description of Dubai Link Realty and the services offered."

          # ------------------------------------------------------
          # HERO SECTION
          # ------------------------------------------------------

          - label: "Hero Section"
            name: "hero"
            widget: "object"
            fields:

              - label: "Main Hero Headline"
                name: "headline"
                widget: "string"
                hint: "Main headline displayed at the top of the homepage."

              - label: "Hero Supporting Text"
                name: "description"
                widget: "text"
                required: false
                hint: "Short supporting text displayed below the main headline."

              - label: "Hero Background Image"
                name: "image"
                widget: "image"
                required: false
                hint: "Upload the main image used in the homepage hero section."

              - label: "Primary CTA Button Text"
                name: "primary_cta_text"
                widget: "string"
                required: false
                hint: "Example: Explore Properties"

              - label: "Primary CTA Button Link"
                name: "primary_cta_link"
                widget: "string"
                required: false
                hint: "Example: #projects"

              - label: "Secondary CTA Button Text"
                name: "secondary_cta_text"
                widget: "string"
                required: false
               
