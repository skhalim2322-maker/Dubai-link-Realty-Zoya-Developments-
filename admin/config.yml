backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

publish_mode: editorial_workflow

collections:

  # ==========================================================
  # SITE SETTINGS / GLOBAL
  # ==========================================================
  - name: "site_settings"
    label: "Site Settings"
    files:

      - file: "content/site.yml"
        label: "Global"
        name: "global"

        fields:

          # ----------------------------------------------------
          # HERO
          # ----------------------------------------------------
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:

              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                default: "Exclusive Partnership with Zoya Developments"

              - label: "Main Headline"
                name: "headline"
                widget: "string"
                default: "Luxury Living in the"

              - label: "Highlighted Headline"
                name: "highlight"
                widget: "string"
                default: "Heart of Dubai"

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Background Image"
                name: "background_image"
                widget: "image"

              - label: "Primary CTA"
                name: "primary_cta"
                widget: "object"
                fields:

                  - label: "Button Text"
                    name: "text"
                    widget: "string"
                    default: "Explore Properties"

                  - label: "Button Link"
                    name: "link"
                    widget: "string"
                    default: "#projects"

              - label: "Secondary CTA"
                name: "secondary_cta"
                widget: "object"
                fields:

                  - label: "Button Text"
                    name: "text"
                    widget: "string"
                    default: "Schedule a Visit"

                  - label: "Button Link"
                    name: "link"
                    widget: "string"
                    default: "#contact"


          # ----------------------------------------------------
          # ABOUT
          # ----------------------------------------------------
          - label: "About"
            name: "about"
            widget: "object"
            fields:

              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                default: "Official Channel Partner"

              - label: "Heading"
                name: "heading"
                widget: "string"

              - label: "Content"
                name: "content"
                widget: "markdown"

              - label: "Image"
                name: "image"
                widget: "image"

              - label: "Partner Name"
                name: "partner_name"
                widget: "string"
                default: "Dubai Link Realty × Zoya Developments"


          # ----------------------------------------------------
          # STATISTICS
          # ----------------------------------------------------
          - label: "Statistics"
            name: "statistics"
            widget: "list"
            required: false
            fields:

              - label: "Number"
                name: "number"
                widget: "string"

              - label: "Label"
                name: "label"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "string"
                required: false


          # ----------------------------------------------------
          # PROJECTS SECTION
          # ----------------------------------------------------
          - label: "Projects Section"
            name: "projects_section"
            widget: "object"
            fields:

              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                default: "Zoya Developments"

              - label: "Heading"
                name: "heading"
                widget: "string"
                default: "Featured Flagship Projects"

              - label: "Description"
                name: "description"
                widget: "text"


          # ----------------------------------------------------
          # AMENITIES
          # ----------------------------------------------------
          - label: "Amenities"
            name: "amenities"
            widget: "list"
            required: false
            fields:

              - label: "Title"
                name: "title"
                widget: "string"

              - label: "Description"
                name: "description"
                widget: "string"

              - label: "Icon"
                name: "icon"
                widget: "string"
                required: false


          # ----------------------------------------------------
          # CONTACT / CTA
          # ----------------------------------------------------
          - label: "Contact CTA"
            name: "contact"
            widget: "object"
            fields:

              - label: "Eyebrow"
                name: "eyebrow"
                widget: "string"
                default: "Get in Touch"

              - label: "Heading"
                name: "heading"
                widget: "string"
                default: "Register for Project Pricing & Inventory"

              - label: "Description"
                name: "description"
                widget: "text"

              - label: "Button Text"
                name: "button_text"
                widget: "string"
                default: "Submit Inquiry"


          # ----------------------------------------------------
          # GLOBAL SEO
          # ----------------------------------------------------
          - label: "SEO"
            name: "seo"
            widget: "object"
            fields:

              - label: "Meta Title"
                name: "meta_title"
                widget: "string"
                default: "Dubai Link Realty | Zoya Developments"

              - label: "Meta Description"
                name: "meta_description"
                widget: "text"

              - label: "Keywords"
                name: "keywords"
                widget: "string"
                required: false

              - label: "Social Share Image"
                name: "social_image"
                widget: "image"
                required: false


  # ==========================================================
  # PROJECTS
  # ==========================================================
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "project_name"

    fields:

      # --------------------------------------------------------
      # BASIC PROJECT INFORMATION
      # --------------------------------------------------------
      - label: "Project Name"
        name: "project_name"
        widget: "string"

      - label: "Location"
        name: "location"
        widget: "string"


      # --------------------------------------------------------
      # FEATURED IMAGE
      # --------------------------------------------------------
      - label: "Featured Image"
        name: "featured_image"
        widget: "image"


      # --------------------------------------------------------
      # PROJECT STATUS
      # --------------------------------------------------------
      - label: "Status"
        name: "status"
        widget: "select"
        options:
          - "Ready to Move"
          - "New Launch"
          - "Under Construction"
        default: "New Launch"


      # --------------------------------------------------------
      # PROPERTY TYPE
      # --------------------------------------------------------
      - label: "Property Type"
        name: "property_type"
        widget: "select"
        options:
          - "Studio"
          - "1 Bedroom"
          - "2 Bedroom"
          - "3 Bedroom"
          - "4 Bedroom"
          - "Penthouse"
          - "Villa"
          - "Townhouse"
          - "Commercial"


      # --------------------------------------------------------
      # PRICE
      # --------------------------------------------------------
      - label: "Price"
        name: "price"
        widget: "string"
        required: false
        hint: "Example: AED 750,000"


      # --------------------------------------------------------
      # PAYMENT PLAN
      # --------------------------------------------------------
      - label: "Payment Plan"
        name: "payment_plan"
        widget: "string"
        required: false
        hint: "Example: 1% Monthly"


      # --------------------------------------------------------
      # HANDOVER
      # --------------------------------------------------------
      - label: "Handover"
        name: "handover"
        widget: "string"
        required: false
        hint: "Example: Q4 2027"


      # --------------------------------------------------------
      # BROCHURE / PDF
      # --------------------------------------------------------
      - label: "Brochure / PDF"
        name: "brochure"
        widget: "file"
        required: false
        media_library:
          config:
            multiple: false


      # --------------------------------------------------------
      # GALLERY
      # --------------------------------------------------------
      - label: "Gallery"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Image"
          name: "image"
          widget: "image"


      # --------------------------------------------------------
      # FULL DESCRIPTION
      # --------------------------------------------------------
      - label: "Full Description"
        name: "description"
        widget: "markdown"
        required: false


      # --------------------------------------------------------
      # PROJECT FEATURES
      # --------------------------------------------------------
      - label: "Project Features"
        name: "features"
        widget: "list"
        required: false
        field:
          label: "Feature"
          name: "feature"
          widget: "string"


      # --------------------------------------------------------
      # SEO
      # --------------------------------------------------------
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        fields:

          - label: "Meta Title"
            name: "meta_title"
            widget: "string"
            required: false

          - label: "Meta Description"
            name: "meta_description"
            widget: "text"
            required: false

          - label: "Social Share Image"
            name: "social_image"
            widget: "image"
            required: false
